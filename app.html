<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastronoire – Prémium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --black:#0A0A0C;--black2:#0F1014;--panel:#14151A;--panel2:#1B1D24;
    --gold:#D4AF37;--gold-lt:#E8CD7A;--gold-dk:#8C6F1E;
    --silver:#C0C6CF;--silver-dk:#6B7280;
    --txt:#EDEEF2;--dim:#8A8F9A;--line:rgba(212,175,55,.22);--line-s:rgba(192,198,207,.14);
    --grad-gold:linear-gradient(135deg,#F3E3A6,#D4AF37 45%,#8C6F1E);
  }
  *{box-sizing:border-box}
  ::selection{background:var(--gold);color:#0A0A0C}
  ::-moz-selection{background:var(--gold);color:#0A0A0C}
  body{margin:0;background:var(--black);color:var(--txt);font-family:'Inter',system-ui,sans-serif;line-height:1.6;
    background-image:radial-gradient(circle at 20% -10%,rgba(212,175,55,.10),transparent 45%),
                     radial-gradient(circle at 90% 5%,rgba(192,198,207,.05),transparent 40%);
    background-attachment:fixed;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.4px}
  a{color:inherit;text-decoration:none}
  nav{position:sticky;top:0;z-index:100;background:rgba(10,10,12,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1200px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{display:flex;align-items:center;gap:13px}
  .mono{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--grad-gold);
    color:#0A0A0C;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;
    box-shadow:0 0 0 1px rgba(192,198,207,.4),0 0 22px rgba(212,175,55,.35)}
  .logo .name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;letter-spacing:2px}
  .logo .name b{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .nav-cta{display:flex;gap:12px;align-items:center}
  .btn{border:none;cursor:pointer;font:inherit;padding:11px 20px;border-radius:10px;font-weight:600;transition:.18s;white-space:nowrap}
  .btn.gold{background:var(--grad-gold);color:#0A0A0C;box-shadow:0 4px 18px rgba(212,175,55,.28)}
  .btn.gold:hover{transform:translateY(-1px)}
  .btn.line{background:transparent;color:var(--silver);border:1px solid var(--line-s)}
  .btn.line:hover{border-color:var(--gold);color:var(--gold-lt)}
  .btn.sm{padding:8px 14px;font-size:13.5px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px}

  /* HERO */
  .hero-deco{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 8px;max-width:420px}
  .hero-deco span{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .hero-deco i{color:var(--gold);font-style:normal;font-size:14px;letter-spacing:6px}
  .hero{padding:82px 22px 56px;text-align:center;position:relative}
  .eyebrow{display:inline-block;font-size:12.5px;letter-spacing:3.5px;text-transform:uppercase;color:var(--gold);
    border:1px solid var(--line);padding:7px 18px;border-radius:999px;margin-bottom:26px}
  .hero h1{font-size:clamp(42px,7vw,78px);line-height:1.05;margin:0 0 18px}
</style>
</head>
<body>
<!-- GASTRONOIR APP: a fájl törzse a következő lépésben töltődik fel a teljes tartalommal -->
</body>
</html>
